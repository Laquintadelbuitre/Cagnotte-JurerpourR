<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cagnotte langage — Limoges Football</title>
<meta name="description" content="Compteur des amendes fair-play (jurons) pendant les entraînements U13 du Limoges Football, synchronisé en direct.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:     #0c1322;
    --bg-bottom:  #182642;

    --ink:        #fff6ec;
    --ink-soft:   #c9d2e0;
    --card-bg-solid: #16213b;
    --card-border:rgba(255, 255, 255, 0.14);
    --card-shadow: 0 16px 34px -18px rgba(0,0,0,.6), 0 2px 0 rgba(255,255,255,.04) inset;

    --tile-bg:    #131b30;

    --gold:       #fdd116;
    --juron:      #f6a63c;
    --ok:         #4cc26a;
    --live-dot:   #4cc26a;
    --demo-dot:   #fdd116;

    color-scheme: dark;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; min-height:100%;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.05), transparent 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    padding: 28px 18px 100px;
    overflow-x:hidden;
  }

  h1,h2,.display{ font-family:"Fredoka", system-ui, sans-serif; }
  .num{ font-variant-numeric: tabular-nums; font-family:"Space Mono", ui-monospace, monospace; }

  .wrap{ max-width: 1180px; margin: 0 auto; }
  .narrow{ max-width: 760px; margin: 0 auto; }

  header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:22px;
  }
  .title-row{ display:flex; align-items:center; gap:16px; }
  .club-logo{ width:56px; height:56px; flex:none; filter: drop-shadow(0 2px 10px rgba(0,0,0,.35)); }
  header .eyebrow{
    font-size:12px; text-transform:uppercase; letter-spacing:.16em; color: var(--gold);
    margin:0 0 6px; font-weight:600;
  }
  h1{ font-size: clamp(26px,4.6vw,38px); margin:0; font-weight:600; }
  .status{
    display:flex; align-items:center; gap:9px; font-size:13px; color: var(--ink-soft);
    background: rgba(15,22,40,.6); border:1px solid var(--card-border); border-radius:999px;
    padding:8px 16px 8px 12px; backdrop-filter: blur(8px);
  }
  .dot{ width:8px; height:8px; border-radius:50%; background: var(--demo-dot); flex:none; }
  .dot.live{ background: var(--live-dot); box-shadow: 0 0 0 4px color-mix(in srgb, var(--live-dot) 25%, transparent); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 3px color-mix(in srgb, var(--live-dot) 25%, transparent) } 50%{ box-shadow:0 0 0 7px color-mix(in srgb, var(--live-dot) 10%, transparent) } }
  .status button{
    border:none; background:transparent; color: var(--ink-soft); cursor:pointer; font-size:13px;
    padding:2px 6px; border-radius:6px; font-family:inherit; text-decoration:underline;
  }
  .status button:hover{ color: var(--ink); }

  /* ---- Bandeau total ---- */
  .totalBanner{
    background: var(--card-bg-solid); border:1px solid var(--card-border); border-radius:22px;
    box-shadow: var(--card-shadow); padding:20px 26px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  }
  .totalBanner .label{ font-size:13px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.1em; margin:0 0 4px; }
  .totalBanner .amount{ font-size: clamp(32px,5.6vw,44px); font-weight:700; margin:0; }
  .rule-chip{
    display:flex; align-items:center; gap:7px; background: rgba(255,255,255,.06);
    border:1px solid var(--card-border); border-radius:999px; padding:8px 14px; font-size:13px;
  }
  .rule-dot{ width:9px; height:9px; border-radius:50%; flex:none; }

  /* ---- Bandeau annuler ---- */
  .undoBanner{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background: rgba(253,209,22,.1); border:1px solid rgba(253,209,22,.4); border-radius:16px;
    padding:12px 18px; margin-bottom:22px; animation: undo-pop 300ms ease;
  }
  .undoBanner p{ margin:0; font-size:14px; }
  .undoBanner b{ color: var(--gold); }
  @keyframes undo-pop{ from{ opacity:0; transform: translateY(-6px); } to{ opacity:1; transform:translateY(0); } }
  .btn-undo{ background: var(--gold); color:#2b2205; font-weight:700; white-space:nowrap; border:none; border-radius:10px; padding:9px 14px; cursor:pointer; font-family:inherit; font-size:13.5px; }
  .btn-undo:hover{ filter:brightness(1.08); }

  .grid-caption{ text-align:center; color: var(--ink-soft); font-size:13px; margin: 0 0 16px; }
  .grid-caption b{ color: var(--ink); }

  /* ---- Pastilles des joueurs ---- */
  .playerGrid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-bottom:26px;
  }
  .ptile{
    position:relative; background: var(--tile-bg); border:2px solid var(--card-border); border-radius:999px;
    padding:16px 14px; text-align:center; cursor:pointer; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    min-height:76px; transition: transform 110ms ease, border-color 150ms ease, background 150ms ease;
  }
  .ptile:hover{ background:#182238; }
  .ptile:active{ transform: scale(.96); }
  .ptile:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .ptile .pname{ font-weight:700; font-size:15px; color: var(--ink); }
  .ptile .psub{ font-size:12px; color: var(--ink-soft); font-family:"Space Mono", monospace; }
  .ptile.hasCount{ border-color: var(--juron); background: rgba(246,166,60,.09); }
  .ptile.hasCount .psub{ color: var(--ink); font-weight:700; }
  .ptile-badge{
    position:absolute; top:-7px; right:-7px; width:22px; height:22px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
    color:#1a0f10; background: var(--juron); box-shadow:0 2px 6px rgba(0,0,0,.4); opacity:0; transform: scale(.4);
    transition: opacity 200ms ease, transform 200ms cubic-bezier(.3,1.6,.5,1);
  }
  .ptile.pulse .ptile-badge{ opacity:1; transform: scale(1); }
  .ptile.pulse{ animation: tile-pulse 480ms ease; }
  @keyframes tile-pulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.06); }
    100%{ transform:scale(1); }
  }
  @media (prefers-reduced-motion: reduce){ .ptile.pulse{ animation:none; } }
  @media (max-width:620px){ .playerGrid{ grid-template-columns: repeat(2, 1fr); } }
  @media (max-width:380px){ .playerGrid{ grid-template-columns: 1fr; } }

  /* ---- Cagnottes individuelles ---- */
  .players{
    background: var(--card-bg-solid); border:1px solid var(--card-border); border-radius:22px;
    padding:20px 22px; box-shadow: var(--card-shadow); margin-bottom:18px;
  }
  .players h2{ font-size:16px; margin:0 0 14px; font-weight:600; }
  .players-grid{
    display:grid; gap:10px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .player-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background: rgba(255,255,255,.04); border:1px solid var(--card-border); border-radius:12px;
    padding:10px 12px;
  }
  .player-row .pname{ font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .player-row .ptotal{ font-size:14.5px; font-weight:700; flex:none; }
  .player-row .ptotal.zero{ color: var(--ink-soft); font-weight:600; }
  .player-row .pedit{
    border:none; background:transparent; color: var(--ink-soft); cursor:pointer; font-size:13px;
    padding:2px 5px; border-radius:6px; flex:none;
  }
  .player-row .pedit:hover{ background: rgba(255,255,255,.08); color: var(--ink); }

  .edit-panel{
    grid-column: 1 / -1; display:flex; flex-direction:column; gap:8px;
    background: rgba(255,255,255,.04); border:1px solid var(--card-border); border-radius:12px; padding:12px;
  }
  .edit-actions{ display:flex; justify-content:space-between; gap:8px; }

  input[type="text"]{
    font-family: inherit; font-size:14px; color: var(--ink);
    background: rgba(255,255,255,.06); border:1px solid var(--card-border);
    border-radius:10px; padding:9px 10px; width:100%;
  }
  input::placeholder{ color: var(--ink-soft); }
  input:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
  button{ font-family:"Inter", sans-serif; }
  .btn-primary{ background: linear-gradient(135deg, #ff5a1f, var(--gold)); color:#1a0f10; white-space:nowrap; font-weight:700; border:none; border-radius:10px; padding:9px 14px; cursor:pointer; font-size:13.5px; }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-ghost{ background: rgba(255,255,255,.06); border:1px solid var(--card-border); color: var(--ink); border-radius:10px; padding:9px 14px; cursor:pointer; font-size:13.5px; font-weight:600; }
  .btn-ghost:hover{ background: rgba(255,255,255,.12); }
  .btn-danger{ background:transparent; border:1px solid var(--card-border); color:#e0555f; border-radius:10px; padding:9px 14px; cursor:pointer; font-size:13.5px; font-weight:600; }
  .btn-danger.confirm{ background:#c81e2c; color:#fff6ec; border-color:#c81e2c; }
  .field-error{ margin:-4px 0 0; font-size:12.5px; color:#e0555f; }


  /* ---- Journal ---- */
  .journal{
    background: var(--card-bg-solid); border:1px solid var(--card-border); border-radius:20px;
    padding:18px 20px; box-shadow: var(--card-shadow);
  }
  .journal h2{ font-size:16px; margin:0 0 12px; font-weight:600; }
  .journal-empty{ color: var(--ink-soft); font-size:13.5px; margin:0; }
  .journal-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .journal-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:8px 10px; border-radius:10px; background: rgba(255,255,255,.03); font-size:13.5px;
  }
  .journal-left{ display:flex; align-items:center; gap:9px; min-width:0; }
  .journal-dot{ width:9px; height:9px; border-radius:50%; flex:none; background: var(--juron); }
  .journal-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .journal-time{ color: var(--ink-soft); font-size:12px; flex:none; }
  .journal-cancel{ border:none; background:transparent; color: var(--ink-soft); cursor:pointer; text-decoration:underline; padding:0; font-size:12px; font-family:inherit; }

  footer{ text-align:center; color: var(--ink-soft); font-size:12px; margin-top:36px; opacity:.8; }

  @media (max-width:480px){
    .totalBanner{ flex-direction:column; align-items:flex-start; }
    .undoBanner{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title-row">
      <img class="club-logo" src="assets/logo-limoges-football.png" alt="Limoges Football">
      <div>
        <p class="eyebrow">Entraînements U13 · Fair-play</p>
        <h1>Cagnotte langage</h1>
      </div>
    </div>
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connexion…</span>
      <button id="refreshBtn" type="button" title="Rafraîchir">↻</button>
    </div>
  </header>

  <div class="totalBanner">
    <div>
      <p class="label">Cagnotte collective</p>
      <p class="amount num" id="totalAmount">0 €</p>
    </div>
    <span class="rule-chip"><span class="rule-dot"></span>0,50 € à chaque appui</span>
  </div>

  <div id="undoZone"></div>

  <div class="narrow">
    <p class="grid-caption">Appuyez sur un joueur pour ajouter <b>0,50 €</b> à sa cagnotte.</p>
    <div class="playerGrid" id="playerGrid"></div>
  </div>

  <div class="players">
    <h2>Cagnotte individuelle par joueur</h2>
    <div class="players-grid" id="playersGrid"></div>
  </div>

  <div class="journal">
    <h2>Dernières amendes</h2>
    <div id="journalZone"></div>
  </div>

  <footer>Limoges Football U13 · Cagnotte fair-play · propulsé par Google Sheets</footer>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     ⚙️  CONFIGURATION
     ============================================================
     Même Google Sheet / même déploiement Apps Script que la
     cagnotte "Cap sur le Sénégal" (onglets "Joueurs" et "Amendes").
     Laissez vide pour lancer la page en mode démonstration.
  ============================================================ */
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyoWvec73omyuk3pqeE0S3SNyiQzVK6oAMmdaEfTmx45d6y2gR1TY9I5jO2zM3WghVIwA/exec";
  var POLL_MS = 15000;

  var TARIF_JURON = 0.5;

  /* Liste fixe des 23 joueurs — écrite ici en dur, ne dépend d'aucune
     feuille Google Sheet : elle s'affiche donc toujours, même si
     l'onglet "Joueurs" du Sheet est vide ou pas encore créé. */
  var JOUEURS = [
    { id:"j1",  nom:"Abdoul Karim" },
    { id:"j2",  nom:"Adam" },
    { id:"j3",  nom:"Bakoutoubo" },
    { id:"j4",  nom:"Bilel" },
    { id:"j5",  nom:"Emir" },
    { id:"j6",  nom:"Ethan" },
    { id:"j7",  nom:"Gabin" },
    { id:"j8",  nom:"Hadi" },
    { id:"j9",  nom:"Issam" },
    { id:"j10", nom:"Jalil" },
    { id:"j11", nom:"Kalifa" },
    { id:"j12", nom:"Keys" },
    { id:"j13", nom:"Loan" },
    { id:"j14", nom:"Mathis" },
    { id:"j15", nom:"Melih" },
    { id:"j16", nom:"Mickaël" },
    { id:"j17", nom:"Nourou" },
    { id:"j18", nom:"Pablo" },
    { id:"j19", nom:"Sacha" },
    { id:"j20", nom:"Sarah" },
    { id:"j21", nom:"Sebastien" },
    { id:"j22", nom:"Selyan" },
    { id:"j23", nom:"Yanis" }
  ];

  var state = { amendes: [], mode: "loading" };
  var lastActionId = null;
  var pollTimer = null;
  var pulseId = null;

  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");
  var refreshBtn = document.getElementById("refreshBtn");
  var totalAmountEl = document.getElementById("totalAmount");
  var undoZone = document.getElementById("undoZone");
  var playerGrid = document.getElementById("playerGrid");
  var playersGrid = document.getElementById("playersGrid");
  var journalZone = document.getElementById("journalZone");

  function euros(n){
    n = Number(n) || 0;
    return new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR", minimumFractionDigits: (n % 1 !== 0) ? 2 : 0, maximumFractionDigits:2 }).format(n);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function timeAgo(ts){
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return "à l'instant";
    var m = Math.round(s / 60);
    if (m < 60) return "il y a " + m + " min";
    var h = Math.round(m / 60);
    return "il y a " + h + " h";
  }
  function sortedJoueurs(){
    return JOUEURS.slice().sort(function(a,b){
      return String(a.nom).localeCompare(String(b.nom), "fr", { numeric: true });
    });
  }
  function activeAmendes(){
    return state.amendes.filter(function(a){ return a.statut !== "annule"; });
  }
  function totalFor(joueurId){
    return activeAmendes()
      .filter(function(a){ return a.joueurId === joueurId; })
      .reduce(function(sum, a){ return sum + (Number(a.montant) || 0); }, 0);
  }
  function countFor(joueurId){
    return activeAmendes().filter(function(a){ return a.joueurId === joueurId; }).length;
  }

  function setStatus(mode){
    state.mode = mode;
    if (mode === "live"){ statusDot.className = "dot live"; statusText.textContent = "Synchronisé"; }
    else if (mode === "demo"){ statusDot.className = "dot"; statusText.textContent = "Mode démo"; }
    else if (mode === "error"){
      statusDot.className = "dot";
      statusText.textContent = state.amendes.length ? "Hors ligne (dernier montant connu)" : "Connexion…";
    }
    else { statusDot.className = "dot"; statusText.textContent = "Connexion…"; }
  }

  // ---- Cache local (survit aux coupures réseau et aux rechargements) ----
  var CACHE_KEY = "cagnotte-langage-cache-v1";
  function saveCache(amendes){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ amendes: amendes, savedAt: Date.now() })); }
    catch (e) { /* stockage indisponible (navigation privée, etc.) : sans conséquence */ }
  }
  function loadCache(){
    try {
      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return (parsed && Array.isArray(parsed.amendes)) ? parsed.amendes : null;
    } catch (e) { return null; }
  }

  function updateTotal(){
    var total = activeAmendes().reduce(function(sum, a){ return sum + (Number(a.montant) || 0); }, 0);
    totalAmountEl.textContent = euros(total);
  }

  // ---- Pastilles des joueurs ----
  function renderGrid(){
    var joueurs = sortedJoueurs();
    playerGrid.innerHTML = joueurs.map(function(j){
      var count = countFor(j.id);
      var montant = count * TARIF_JURON;
      var isPulsing = pulseId === j.id;
      var classes = "ptile" + (count > 0 ? " hasCount" : "") + (isPulsing ? " pulse" : "");
      return (
        '<button type="button" class="' + classes + '" data-action="tap-tile" data-id="' + j.id + '">' +
          '<span class="ptile-badge">✓</span>' +
          '<span class="pname">' + esc(j.nom) + '</span>' +
          (count > 0 ? '<span class="psub num">' + euros(montant) + '</span>' : '') +
        '</button>'
      );
    }).join("");
    pulseId = null;
  }

  // ---- Cagnottes individuelles ----
  function renderPlayers(){
    var joueurs = sortedJoueurs();
    playersGrid.innerHTML = joueurs.map(function(j){
      var total = totalFor(j.id);
      return (
        '<div class="player-row" data-id="' + j.id + '">' +
          '<span class="pname" title="' + esc(j.nom) + '">' + esc(j.nom) + '</span>' +
          '<span class="ptotal num' + (total <= 0 ? ' zero' : '') + '">' + euros(total) + '</span>' +
        '</div>'
      );
    }).join("");
  }

  // ---- Bandeau "Annuler" ----
  function renderUndo(){
    var last = lastActionId ? state.amendes.find(function(a){ return a.id === lastActionId && a.statut !== "annule"; }) : null;
    if (!last){ undoZone.innerHTML = ""; return; }
    undoZone.innerHTML =
      '<div class="undoBanner">' +
        '<p>Dernière amende : <b>' + euros(last.montant) + '</b> pour <b>' + esc(last.joueurNom) + '</b>.</p>' +
        '<button type="button" class="btn-undo" data-action="undo-last">↩ Annuler</button>' +
      '</div>';
  }

  // ---- Journal des dernières amendes ----
  function renderJournal(){
    var entries = activeAmendes()
      .slice()
      .sort(function(a,b){ return (b.timestamp||0) - (a.timestamp||0); })
      .slice(0, 10);
    if (!entries.length){
      journalZone.innerHTML = '<p class="journal-empty">Aucune amende enregistrée pour le moment.</p>';
      return;
    }
    journalZone.innerHTML = '<ul class="journal-list">' + entries.map(function(a){
      var canCancel = a.id === lastActionId;
      return (
        '<li class="journal-row">' +
          '<div class="journal-left">' +
            '<span class="journal-dot"></span>' +
            '<span class="journal-text">' + esc(a.joueurNom) + ' — ' + euros(a.montant) + '</span>' +
          '</div>' +
          '<span class="journal-time">' + timeAgo(a.timestamp) +
            (canCancel ? ' · <button type="button" class="journal-cancel" data-action="undo-last">annuler</button>' : '') +
          '</span>' +
        '</li>'
      );
    }).join("") + '</ul>';
  }

  function render(){
    renderGrid();
    renderPlayers();
    updateTotal();
    renderUndo();
    renderJournal();
  }

  function hasBackend(){ return !!APPS_SCRIPT_URL; }

  function apiGet(){
    return fetch(APPS_SCRIPT_URL, { method: "GET" }).then(function(r){ return r.json(); });
  }
  function apiPost(action, payload){
    var body = Object.assign({ action: action }, payload);
    return fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json(); });
  }

  var retryTimer = null;

  function loadFromBackend(){
    apiGet().then(function(res){
      if (!res || !res.ok){ throw new Error("bad response"); }
      state.amendes = (res.amendes || []).slice();
      saveCache(state.amendes);
      setStatus("live");
      render();
      if (retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
    }).catch(function(){
      // La synchronisation a échoué (réseau, Sheet pas encore prêt, etc.) :
      // on le signale, mais on GARDE les derniers montants connus affichés
      // (venant du cache local ou du dernier chargement réussi) au lieu de
      // les effacer, et on retente plus vite que le rythme normal.
      setStatus("error");
      render();
      if (!retryTimer){
        retryTimer = setTimeout(function(){
          retryTimer = null;
          loadFromBackend();
        }, 5000);
      }
    });
  }

  function startPolling(){
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(loadFromBackend, POLL_MS);
  }

  function init(){
    // Charge d'abord le dernier montant connu localement (si disponible),
    // pour ne jamais afficher "0 €" juste parce que le réseau met du temps
    // à répondre, puis affiche immédiatement les 23 pastilles.
    var cached = loadCache();
    if (cached) state.amendes = cached;
    render();

    if (!hasBackend()){
      state.amendes = [];
      setStatus("demo");
      render();
      return;
    }
    loadFromBackend();
    startPolling();
  }

  refreshBtn.addEventListener("click", function(){ if (hasBackend()) loadFromBackend(); });

  // ---- Mutations ----
  function addInfraction(joueurId, joueurNom){
    var montant = TARIF_JURON;
    var localEntry = {
      id: "local-" + Date.now(),
      joueurId: joueurId, joueurNom: joueurNom, type: "juron",
      montant: montant, timestamp: Date.now(), statut: "actif"
    };
    state.amendes.push(localEntry);
    lastActionId = localEntry.id;
    pulseId = joueurId;
    render();

    if (hasBackend()){
      apiPost("add_infraction", { joueurId: joueurId, joueurNom: joueurNom, type: "juron" }).then(function(res){
        if (res && res.ok && res.entry){
          var idx = state.amendes.findIndex(function(a){ return a.id === localEntry.id; });
          if (idx > -1){
            state.amendes[idx] = res.entry;
            if (lastActionId === localEntry.id) lastActionId = res.entry.id;
            render();
          }
        } else {
          loadFromBackend();
        }
      }).catch(function(){});
    }
  }

  function undoLast(){
    if (!lastActionId) return;
    var entry = state.amendes.find(function(a){ return a.id === lastActionId; });
    if (!entry) return;
    entry.statut = "annule";
    var undoneId = lastActionId;
    lastActionId = null;
    render();
    if (hasBackend() && undoneId.indexOf("local-") !== 0){
      apiPost("cancel_infraction", { id: undoneId }).catch(function(){});
    }
  }

  // ---- Events ----
  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;
    var id = btn.dataset.id;

    if (action === "tap-tile"){
      var joueur = JOUEURS.find(function(x){ return x.id === id; });
      addInfraction(id, joueur ? joueur.nom : "");
    } else if (action === "undo-last"){
      undoLast();
    }
  });

  init();
})();
</script>
</body>
</html>
